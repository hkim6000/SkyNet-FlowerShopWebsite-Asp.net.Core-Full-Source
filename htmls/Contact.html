<div class="cn-site" data-page="Contact">
<header class="cn-head" id="cn-head">
    <div class="cn-head-row">
        <button type="button" class="cn-burger" aria-label="Menu" onclick="ContactJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="cn-logo" href="Home" aria-label="Home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#B8445F"/><g fill="#FBF7F2"><circle cx="20" cy="11" r="5"/><circle cx="29" cy="18" r="5"/><circle cx="26" cy="28" r="5"/><circle cx="14" cy="28" r="5"/><circle cx="11" cy="18" r="5"/></g><circle cx="20" cy="20" r="4" fill="#E9C46A"/></svg><span>{plhd_brand}</span></a>
        <nav class="cn-nav" id="cn-nav" aria-label="Main">
            <div class="cn-nav-top"><b>Menu</b><button type="button" class="cn-ibtn" aria-label="Close" onclick="ContactJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="cn-menu"><li><a class="cn-ml" href="Home">Home</a></li><li><a class="cn-ml" href="Shop">Shop</a></li><li><a class="cn-ml" href="About">About</a></li><li><a class="cn-ml" href="Track">Track an order</a></li><li><a class="cn-ml cn-on" href="Contact">Contact</a></li></ul>
        </nav>
        <form class="cn-search" onsubmit="return ContactJs.go()" role="search">
            <span class="cn-search-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
            <input type="search" id="cn-q" placeholder="Search bouquets" autocomplete="off" maxlength="40" oninput="ContactJs.search(this.value)" aria-label="Search bouquets">
            <div class="cn-sugg" id="cn-sugg"></div>
        </form>
        <a class="cn-cart" href="Cart" aria-label="Cart"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11H6.2L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><i class="cn-cartn" id="cn-cartn">0</i></a>
    </div>
    <div class="cn-scrim" id="cn-scrim" onclick="ContactJs.closeNav()"></div>
</header>
<main class="cn-main">
{plhd_blocks}
</main>
<footer class="cn-foot">{plhd_foot}</footer>
<div class="cn-toast" id="cn-toast" role="status" aria-live="polite"></div>
</div>
