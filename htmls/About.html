<div class="ab-site" data-page="About">
<header class="ab-head" id="ab-head">
    <div class="ab-head-row">
        <button type="button" class="ab-burger" aria-label="Menu" onclick="AboutJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <a class="ab-logo" href="Home" aria-label="Home"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#B8445F"/><g fill="#FBF7F2"><circle cx="20" cy="11" r="5"/><circle cx="29" cy="18" r="5"/><circle cx="26" cy="28" r="5"/><circle cx="14" cy="28" r="5"/><circle cx="11" cy="18" r="5"/></g><circle cx="20" cy="20" r="4" fill="#E9C46A"/></svg><span>{plhd_brand}</span></a>
        <nav class="ab-nav" id="ab-nav" aria-label="Main">
            <div class="ab-nav-top"><b>Menu</b><button type="button" class="ab-ibtn" aria-label="Close" onclick="AboutJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <ul class="ab-menu"><li><a class="ab-ml" href="Home">Home</a></li><li><a class="ab-ml" href="Shop">Shop</a></li><li><a class="ab-ml ab-on" href="About">About</a></li><li><a class="ab-ml" href="Track">Track an order</a></li><li><a class="ab-ml" href="Contact">Contact</a></li></ul>
        </nav>
        <form class="ab-search" onsubmit="return AboutJs.go()" role="search">
            <span class="ab-search-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
            <input type="search" id="ab-q" placeholder="Search bouquets" autocomplete="off" maxlength="40" oninput="AboutJs.search(this.value)" aria-label="Search bouquets">
            <div class="ab-sugg" id="ab-sugg"></div>
        </form>
        <a class="ab-cart" href="Cart" aria-label="Cart"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11H6.2L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><i class="ab-cartn" id="ab-cartn">0</i></a>
    </div>
    <div class="ab-scrim" id="ab-scrim" onclick="AboutJs.closeNav()"></div>
</header>
<main class="ab-main">
{plhd_blocks}
</main>
<footer class="ab-foot">{plhd_foot}</footer>
<div class="ab-toast" id="ab-toast" role="status" aria-live="polite"></div>
</div>
